services:
  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      # Add required environment variables below
      # - TOGETHER_API_KEY=your_api_key_here
    env_file:
      - backend/.env
    volumes:
      # Optional: Map local SQLite DB to persist data
      - ./claims.db:/app/claims.db
